{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>FleetView</title>

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        >

        <style>
            #map {
                height: 500px;
            }
        </style>
    </head>


    <body>

        <h1>FleetView</h1>


        <!-- Sélection des navires -->
        <label for="vessels">Select vessels</label>
        <select id="vessels" multiple></select>


        <!-- Sélection de la période -->
        <label for="start-date">Start date</label>
        <input
            type="date"
            id="start-date"
            value="2026-03-01"
        >

        <label for="end-date">End date</label>
        <input
            type="date"
            id="end-date"
            value="2026-08-01"
        >


        <!-- Sélection des variables -->
        <label for="variables">Select variables</label>
        <select id="variables" multiple></select>


        <!-- Colorimétrie de la trajectoire -->
        <label for="color-variable">
            Select a variable for trajectory coloring
        </label>
        <select id="color-variable"></select>

        <label for="reference-value">Add a reference value</label>
        <input
            type="number"
            id="reference-value"
            step="any"
            value="20"
        >

        <label for="tolerance-value">Add a tolerance value</label>
        <input
            type="number"
            id="tolerance-value"
            step="any"
            value="5"
        >


        <!-- Choix du mode d'affichage lorsque plusieurs variables
             et plusieurs navires sont sélectionnés -->
        <label for="chart-view">Chart view:</label>
        <select id="chart-view">
            <option value="variable">By variable</option>
            <option value="vessel">By vessel</option>
        </select>


        <!-- Lancer la recherche -->
        <button id="find">Find</button>

        <!-- Préparer un nouveau replay à partir
             de la dernière recherche effectuée -->
        <button id="replay">Replay</button>


        <!-- Messages et avertissements -->
        <div id="messages"></div>


        <!-- Carte -->
        <div id="map"></div>


        <!-- Contrôles du replay.
             Play lance ou reprend la progression temporelle.
             Pause interrompt le replay sans perdre l'instant courant. -->
        <button id="replay-play">Play</button>
        <button id="replay-pause">Pause</button>


        <!-- Graphes -->
        <div id="charts"></div>


        <!-- Bibliothèques JavaScript -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <!-- Adaptateur nécessaire à Chart.js pour utiliser une échelle temporelle -->
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>


        <!-- Scripts de l'application.
             charts.js est chargé avant app.js car app.js appelle
             les fonctions d'affichage définies dans charts.js.

             replay.js est également chargé avant app.js car app.js
             utilise createReplayTimeline() et réinitialise l'index i
             lorsqu'un nouveau replay est demandé.

             Les variables de la dernière recherche déclarées dans app.js
             seront ensuite utilisées par replay.js au moment où
             l'utilisateur déclenche Play. -->
        <script src="{% static 'fleet/js/charts.js' %}"></script>
        <script src="{% static 'fleet/js/replay.js' %}"></script>
        <script src="{% static 'fleet/js/app.js' %}"></script>

    </body>
</html>
