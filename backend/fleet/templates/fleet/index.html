{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>FleetView</title>

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        >

        <link rel="stylesheet" href="{% static 'fleet/css/style.css' %}">

        
    </head>


    <body>

        <nav id="main-navbar">

            <div id="navbar-brand">
                <h1>FleetView</h1>
            </div>

            <div id="navbar-controls">

                <details id="vessels-dropdown">
                    <summary>Select vessels</summary>
                    <div id="vessel-options"></div>
                </details>

                <div class="navbar-control">
                    <label for="start-date">Start</label>
                    <input
                        type="date"
                        id="start-date"
                        value="2026-03-01"
                    >
                </div>

                <div class="navbar-control">
                    <label for="end-date">End</label>
                    <input
                        type="date"
                        id="end-date"
                        value="2026-08-01"
                    >
                </div>

                <details id="variables-dropdown">
                    <summary>Select variables</summary>
                    <div id="variable-options"></div>
                </details>

                <select id="color-variable">
                    <option value="">Coloring variable</option>
                </select>

                <input
                    type="number"
                    id="reference-value"
                    step="any"
                    value="20"
                    placeholder="Reference"
                >

                <input
                    type="number"
                    id="tolerance-value"
                    step="any"
                    value="5"
                    placeholder="Tolerance"
                >

                <select id="chart-view">
                    <option value="" selected disabled hidden>Chart view</option>
                    <option value="variable">By variable</option>
                    <option value="vessel">By vessel</option>
                </select>

                <button id="find">Find</button>
                <button id="replay">Replay</button>

            </div>

        </nav>

        <!-- Messages et avertissements -->
        <div id="messages"></div>

        <!-- Carte -->
        <div id="map"></div>

        <!-- Contrôles du replay.
             Play lance ou reprend la progression temporelle.
             Pause interrompt le replay sans perdre l'instant courant. -->
        <button id="replay-play">Play</button>
        <button id="replay-pause">Pause</button>

        <!-- Graphes -->
        <div id="charts"></div>


        <!-- Bibliothèques JavaScript -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <!-- Adaptateur nécessaire à Chart.js pour utiliser une échelle temporelle -->
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

        <!-- Scripts de l'application.
             charts.js est chargé avant app.js car app.js appelle
             les fonctions d'affichage définies dans charts.js.

             replay.js est également chargé avant app.js car app.js
             utilise createReplayTimeline() et réinitialise l'index i
             lorsqu'un nouveau replay est demandé.

             Les variables de la dernière recherche déclarées dans app.js
             seront ensuite utilisées par replay.js au moment où
             l'utilisateur déclenche Play. -->
        <script src="{% static 'fleet/js/map.js' %}"></script>
        <script src="{% static 'fleet/js/charts.js' %}"></script>
        <script src="{% static 'fleet/js/replay.js' %}"></script>
        <script src="{% static 'fleet/js/app.js' %}"></script>

    </body>
</html>
