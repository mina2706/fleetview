{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>FleetView</title>

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        >

        <link rel="stylesheet" href="{% static 'fleet/css/style.css' %}">

        
    </head>


    <body>

        <nav id="main-navbar">

            <div id="navbar-brand">
                <h1>FleetView</h1>
            </div>

            <div id="navbar-controls">

                <details id="vessels-dropdown">
                    <summary>Select vessels</summary>
                    <div id="vessel-options"></div>
                </details>

                <div class="navbar-control">
                    <label for="start-date">Start</label>
                    <input
                        type="date"
                        id="start-date"
                        value="2026-03-01"
                    >
                </div>

                <div class="navbar-control">
                    <label for="end-date">End</label>
                    <input
                        type="date"
                        id="end-date"
                        value="2026-08-01"
                    >
                </div>

                <details id="variables-dropdown">
                    <summary>Select variables</summary>
                    <div id="variable-options"></div>
                </details>

                <select id="color-variable">
                    <option value="">Coloring variable</option>
                </select>

                <input
                    type="number"
                    id="reference-value"
                    step="any"
                    value="20"
                    placeholder="Reference"
                >

                <input
                    type="number"
                    id="tolerance-value"
                    step="any"
                    value="5"
                    placeholder="Tolerance"
                >

                <select id="chart-view" title="Choose your chart view for multi-vessels and multi-variables">
                    <option value="variable">By variable</option>
                    <option value="vessel">By vessel</option>
                </select>

                <button id="find">Find</button>
                <button id="replay">Replay</button>

            </div>

        </nav>

        <!-- Messages et avertissements -->
        <div id="messages"></div>

        <!-- Replay -->
        <div id="replay-view">

            <div id="replay-header">

                <span id="replay-current-time">
                    Current time: —
                </span>
                <!-- replay controls -->
                <div id="replay-controls">

                    <div id="replay-speed-controls">
                        <button id="replay-speed-down">−</button>
                        <span id="replay-speed-value">1×</span>
                        <button id="replay-speed-up">+</button>
                    </div>

                    <button id="replay-play" aria-label="Play" title="Play">▶</button>
                    <button id="replay-pause" aria-label="Pause" title="Pause">⏸</button>

                    <button id="replay-exit" title="Stop replay">■</button>

                </div>

            </div>

            <div id="replay-table-container">
                <table id="replay-table">
                    <thead>
                        <tr id="replay-table-header"></tr>
                    </thead>

                    <tbody id="replay-table-body"></tbody>
                </table>
            </div>

        </div>

        <!-- Carte -->
        <div id="map"></div>


        <!-- Graphes -->
        <div id="charts"></div>
        <div id="chart-overlay"></div>

        <!-- Bibliothèques JavaScript -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <!-- Adaptateur nécessaire à Chart.js pour utiliser une échelle temporelle -->
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

        <!-- Utilitaires et composants chargés avant app.js, qui orchestre le Find et le Replay. -->
        <script src="{% static 'fleet/js/utils.js' %}"></script>
        <script src="{% static 'fleet/js/map.js' %}"></script>
        <script src="{% static 'fleet/js/charts.js' %}"></script>
        <script src="{% static 'fleet/js/replay.js' %}"></script>
        <script src="{% static 'fleet/js/messages.js' %}"></script>
        <script src="{% static 'fleet/js/app.js' %}"></script>

    </body>
</html>
